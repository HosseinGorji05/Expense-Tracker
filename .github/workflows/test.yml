name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        # No GROQ_API_KEY: the suite mocks every Groq HTTP call, so the secret is
        # not needed here and is kept out of CI to avoid exposing it to PR builds.
        run: ./mvnw -B test

      - name: Build Docker image
        run: docker build -t expense-tracker .
