spring.application.name=expense-tracker

spring.datasource.url=jdbc:h2:mem:expensedb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Never accept H2 console connections from other hosts (default, set explicitly).
spring.h2.console.settings.web-allow-others=false

# Don't leak stack traces in error responses (see GlobalExceptionHandler for the
# validation-error shape the API actually returns).
server.error.include-stacktrace=never
server.error.include-message=on-param

# Groq API for AI expense categorization. Key comes from the environment;
# defaults to empty so the app/tests still start without it (categorize falls back to "Other").
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=openai/gpt-oss-20b
